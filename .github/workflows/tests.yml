name: tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==9.0.3 sympy==1.14.0 z3-solver==5.1.0.0 tantivy==0.26.2 pageindex==0.2.20
      - run: python -m pytest -q
